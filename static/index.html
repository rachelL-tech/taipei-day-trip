<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/ui.js" defer></script>
  <script src="/static/auth.js" defer></script>
  <script src="/static/index.js" defer></script>
  <title>台北一日遊</title>
</head>
<body class="page">
  <!-- 1) Sticky（固定） Header -->
  <header class="header header--sticky">
    <div class="header__container">
      <a class="header__logo" href="/">台北一日遊</a>

      <nav class="header__nav">
        <a class="header__nav-link" href="/booking" id="booking-link">預定行程</a>
        <a class="header__nav-link" href="#" id="auth-link"></a> <!-- href="#"代表跳到同頁頂端，並把 # 加到網址；href="/#"則是點了會跳到網站根路徑 /（首頁）的 hash # -->
      </nav>
    </div>
  </header>

  <main class="page__main index__main">
    <!-- 2) Hero (說明 + 搜尋欄) -->
    <section class="hero">
      <div class="hero__bg"></div>

      <div class="hero__container">
        <div class="hero__content">
          <h1 class="hero__title">輕鬆享受台北一日悠閒</h1>
          <p class="hero__subtitle">探索每個角落，體驗城市的深度旅遊行程</p>

          <!-- Search Bar -->
          <form class="search-bar">
            <div class="search-bar__group">

              <!-- Category Dropdown -->
              <div class="category-dropdown">
                <button class="category-dropdown__trigger" type="button">
                  <span class="category-dropdown__trigger-text">全部分類▼</span>
                </button>
                <!-- Popup listbox -->
                <div class="category-dropdown__panel fade-slide" hidden>
                  <ul class="category-dropdown__list" id="category-dropdown-list">
                    <li class="category-dropdown__item" data-category="">全部分類</li>
                    <!-- 用 /api/categories 動態塞入 -->
                  </ul>
                </div>
              </div>

              <!-- 關鍵字搜尋 -->
              <label class="search-bar__field">
                <input
                  class="search-bar__input"
                  type="text"
                  name="keyword"
                  placeholder="輸入景點名稱查詢"
                  autocomplete="off"
                />
              </label>

              <!-- Submit -->
              <button class="search-bar__submit" type="submit">
                <div class="search-bar__submit-icon"></div>
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- 3) Main Content (MRT + Cards) -->
    <section class="main-content">
      <div class="main-content__container">

        <!-- MRT horizontal scroll -->
        <div class="mrt-scroll">
          <div class="mrt-scroll__arrow mrt-scroll__arrow--left"></div> <!-- 往左 -->

          <div class="mrt-scroll__viewport">
            <ul class="mrt-scroll__list">
              <!-- 用 /api/mrts 動態塞入 -->
              <!-- <li class="mrt-scroll__item"><button class="mrt-scroll__btn" type="button">臺大醫院</button></li> -->
            </ul>
          </div>

          <div class="mrt-scroll__arrow mrt-scroll__arrow--right"></div> <!-- 往右 -->
        </div>

        <!-- Attraction cards grid(景點卡片) -->
        <div class="attraction-grid"></div>
          <!-- 用 /api/attractions 動態注入 -->
          <!-- <article class="attraction-card" data-attraction-id="1">
            <a class="attraction-card__link" href="/attraction/<id>>
              <div class="attraction-card__media">
                <img
                  class="attraction-card__image"
                  src="https://www.travel.taipei/d_upload_ttn/sceneadmin/pic/11000848.jpg"
                  alt="平安鐘"
                  loading="lazy"
                />
                <div class="attraction-card__title-bar">
                  <h3 class="attraction-card__title">平安鐘</h3>
                </div>
              </div>

              <div class="attraction-card__meta">
                <span class="attraction-card__mrt">忠孝復興</span>
                <span class="attraction-card__category">公共藝術</span>
              </div>
            </a>
          </article> -->

        <!-- Infinite scroll sentinel（哨兵元素） --> 
        <div class="main-content__sentinel"></div>
      </div>
    </section>
  </main>

  <!-- 4) Footer -->
  <footer class="footer">
    <div class="footer__container">
      <small class="footer__text">COPYRIGHT © 2021 台北一日遊</small>
    </div>
  </footer>

  <!-- Auth Modal -->
  <dialog class="auth-dialog fade-slide" id="auth-dialog">
    <div class="auth-dialog__bar"></div> <!-- 上方彩色條 -->

    <button class="auth-dialog__close" type="button" data-action="close">
      <div class="auth-dialog__close-icon"></div>
    </button>

    <h3 class="auth-dialog__title" id="auth-title">登入會員帳戶</h3>

    <!-- Sign In -->
    <form class="auth-form" id="signin-form">
      <input class="auth-form__input" name="email" type="email" placeholder="輸入電子信箱" required />
      <input class="auth-form__input" name="password" type="password" placeholder="輸入密碼" required />
      <button class="auth-form__submit" type="submit">登入帳戶</button>
      <p class="auth-form__message"></p> <!-- 搭配.auth-form__message:empty讓元素不佔位 -->
      <p class="auth-form__switch">還沒有帳戶？<a href="#" data-action="to-signup">點此註冊</a></p>
    </form>

    <!-- Sign Up -->
    <form class="auth-form" id="signup-form" hidden>
      <input class="auth-form__input" name="name" type="text" placeholder="輸入姓名" required />
      <input class="auth-form__input" name="email" type="email" placeholder="輸入電子郵件" required />
      <input class="auth-form__input" name="password" type="password" placeholder="輸入密碼" required />
      <button class="auth-form__submit" type="submit">註冊新帳戶</button>
      <p class="auth-form__message"></p> <!-- 搭配.auth-form__message:empty讓元素不佔位 -->
      <p class="auth-form__switch">已經有帳戶了？<a href="#" data-action="to-signin">點此登入</a></p>
    </form>
  </dialog>
</body>
</html>
