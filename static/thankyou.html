<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/auth.js" defer></script>
  <script src="/static/thankyou.js" defer></script>
  <title>台北一日遊</title>
</head>
<body class="page">
  <!-- 1) Sticky（固定） Header -->
  <header class="header header--sticky">
    <div class="header__container">
      <a class="header__logo" href="/">台北一日遊</a>

      <nav class="header__nav">
        <a class="header__nav-link" href="/booking" id="booking-link">預定行程</a>
        <a class="header__nav-link" href="#" id="auth-link"></a>
      </nav>
    </div>
  </header>

  <!-- 2) Main Content -->
  <main class="page__main">
    <div class="booking-page__container">
      <h2 class="booking-page__headline">
        您好，<span id="booking-user-name"></span>，付款結果如下：
      </h2>

      <div id="payment-content">
        <!-- 付款失敗時 -->
        <div id="payment-content--failed" hidden>
          <p class="thankyou__desc">
            付款失敗
          </p>

          <p class="thankyou__number">
            <span>訂單編號：</span>
            <span data-order-number>—</span>
          </p>

          <div class="thankyou__actions">
            <a class="btn" href="/booking">回到預訂頁面重試</a>
            <a class="btn btn--ghost" href="/">回到首頁</a>
          </div>
        </div>

        <!-- 付款成功時 -->
        <div id="payment-content--success" hidden>
          <p class="thankyou__desc">
            付款成功，感謝您的訂購！
          </p>

          <p class="thankyou__number">
            <span>訂單編號：</span>
            <span data-order-number>—</span>
          </p>

          <!-- 景點資訊 -->
          <section>
            <div class="booking-trip-card">
              <img
                class="booking-trip-card__image"
                id="booking-image"
                src=""
                alt="預定景點圖片"
              />

              <div class="booking-trip-card__info">
                <a class="booking-trip-card__name" href="/attraction/10">
                  台北一日遊：<span id="booking-attraction-name"></span>
                </a>

                <p class="booking-trip-card__line">
                  <span class="booking-trip-card__label">日期：</span>
                  <span id="booking-date"></span>
                </p>

                <p class="booking-trip-card__line">
                  <span class="booking-trip-card__label">時間：</span>
                  <span id="booking-time"></span>
                </p>

                <p class="booking-trip-card__line">
                  <span class="booking-trip-card__label">費用：</span>
                  <span id="booking-price"></span>
                </p>

                <p class="booking-trip-card__line booking-trip-card__line--address">
                  <span class="booking-trip-card__label">地點：</span>
                  <span id="booking-address"></span>
                </p>
              </div>
            </div>
          </section>

          <div class="thankyou__actions">
            <a class="btn" href="/">回到首頁</a>
          </div>
        </div>
      </div>
    </div>
  </main>
        

  <!-- 4) Footer -->
  <footer class="footer">
    <div class="footer__container">
      <small class="footer__text">COPYRIGHT © 2021 台北一日遊</small>
    </div>
  </footer>

    <!-- Auth Modal -->
  <dialog class="auth-dialog" id="auth-dialog">
    <div class="auth-dialog__bar"></div>

    <button class="auth-dialog__close" type="button" data-action="close">
      <div class="auth-dialog__close-icon"></div>
    </button>

    <h3 class="auth-dialog__title" id="auth-title">登入會員帳號</h3>

    <!-- Sign In -->
    <form class="auth-form" id="signin-form">
      <input class="auth-form__input" name="email" type="email" placeholder="輸入電子信箱" required />
      <input class="auth-form__input" name="password" type="password" placeholder="輸入密碼" required />
      <button class="auth-form__submit" type="submit">登入帳戶</button>
      <p class="auth-form__message"></p>
      <p class="auth-form__switch">還沒有帳戶？<a href="#" data-action="to-signup">點此註冊</a></p>
    </form>

    <!-- Sign Up -->
    <form class="auth-form" id="signup-form" hidden>
      <input class="auth-form__input" name="name" type="text" placeholder="輸入姓名" required />
      <input class="auth-form__input" name="email" type="email" placeholder="輸入電子郵件" required />
      <input class="auth-form__input" name="password" type="password" placeholder="輸入密碼" required />
      <button class="auth-form__submit" type="submit">註冊新帳戶</button>
      <p class="auth-form__message"></p>
      <p class="auth-form__switch">已經有帳戶了？<a href="#" data-action="to-signin">點此登入</a></p>
    </form>
  </dialog>
</body>
</html>
